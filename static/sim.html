<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bedside Sim · HALO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e9eef1;--panel:#ffffff;--ink:#14212b;--mute:#5b6b77;--line:#cdd6dc;--accent:#0b6e8a;--accent-ink:#fff;--soft:#dbe8ee;
--good:#1f7a4d;--warn:#b87800;--bad:#c22f2f;--num:'Barlow Condensed',system-ui,sans-serif;--ui:'IBM Plex Sans',system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161b;--panel:#172129;--ink:#e3ebf0;--mute:#93a4b0;--line:#2b3943;--accent:#3fb1cf;--accent-ink:#06222b;--soft:#1d3440;--good:#4cc38a;--warn:#e0a935;--bad:#ff6b6b}}
:root[data-theme="dark"]{--bg:#0f161b;--panel:#172129;--ink:#e3ebf0;--mute:#93a4b0;--line:#2b3943;--accent:#3fb1cf;--accent-ink:#06222b;--soft:#1d3440;--good:#4cc38a;--warn:#e0a935;--bad:#ff6b6b}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 var(--ui);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hide{display:none!important}

/* ---------- lobby ---------- */
.lobby{min-height:100%;display:grid;place-items:center;padding:24px}
.lobby-card{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}
.lobby h1{font:600 2.4rem/1 var(--num);letter-spacing:.01em;margin:0 0 6px}
.lobby p{color:var(--mute);margin:0 0 20px;max-width:60ch}
.trace{height:44px;width:100%;display:block;margin:0 0 18px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:.85rem;color:var(--mute)}
.field input{font:600 1.6rem var(--num);letter-spacing:.12em;text-transform:uppercase;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.role{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:16px;text-align:left}
.role b{display:block;font:600 1.3rem var(--num)}
.role span{color:var(--mute);font-size:.88rem}
.role.rmon{background:#05080a;color:#cfe;border-color:#05080a}.role.rmon span{color:#7fa}
.note{font-size:.82rem;color:var(--mute);margin-top:14px}

/* ---------- instructor ---------- */
.ins{display:flex;flex-direction:column;height:100%}
.topbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar .room{font:600 1.15rem var(--num);letter-spacing:.1em;padding:2px 10px;border-radius:6px;background:var(--soft)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--mute);margin-right:6px}
.dot.on{background:var(--good)}
.conn{font-size:.85rem;color:var(--mute)}
.mini{margin-left:auto;display:flex;gap:12px;font:600 1.1rem var(--num)}
.mini span{white-space:nowrap}.mini i{font-style:normal;font-weight:400;color:var(--mute);font-size:.8rem;margin-right:3px}
.clock{font:600 1.1rem var(--num);min-width:4.5ch}
.tabs{display:flex;gap:2px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.pane{flex:1;overflow:auto;padding:14px;display:none}
.pane.on{display:block}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.box h2{font:600 1.25rem var(--num);margin:0 0 10px;letter-spacing:.01em}
.box h3{font-size:.95rem;margin:14px 0 6px}
.muted{color:var(--mute)}
.small{font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--bg);padding:9px 14px;border-radius:8px;min-height:42px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:5px 10px;min-height:34px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}
.stage-title{font:600 1.6rem/1.1 var(--num)}
.stagebar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:.88rem}
.chip.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.branch{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:6px}
.branch .to{color:var(--mute);font-size:.85rem;white-space:nowrap}
.branch.good{border-left:5px solid var(--good)}.branch.bad{border-left:5px solid var(--bad)}.branch.mid{border-left:5px solid var(--warn)}
.cue{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:.92rem}
.timer{display:flex;align-items:center;gap:8px;border:1px dashed var(--warn);border-radius:8px;padding:8px 10px;margin-top:10px;font-size:.9rem}
.timer b{font-family:var(--num);font-size:1.15rem}
textarea,.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px}
textarea{min-height:76px;resize:vertical}
.sugg{border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:10px}
.sugg .tag{display:inline-block;font-size:.8rem;padding:2px 8px;border-radius:999px;background:var(--soft);margin-right:6px}
.tag.appropriate{background:color-mix(in srgb,var(--good) 22%,transparent)}.tag.harmful,.tag.inappropriate{background:color-mix(in srgb,var(--bad) 22%,transparent)}.tag.partial{background:color-mix(in srgb,var(--warn) 25%,transparent)}
.orders{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.order{display:flex;justify-content:space-between;gap:8px;align-items:center;border-left:4px solid var(--accent);background:var(--bg);padding:6px 10px;border-radius:6px;font-size:.92rem}
.ctl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.knob{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.knob label{display:flex;justify-content:space-between;font-size:.82rem;color:var(--mute)}
.knob .v{display:flex;align-items:center;gap:6px;margin-top:4px}
.knob .v input[type=number]{width:100%;font:600 1.5rem var(--num);border:0;background:none;padding:0;min-width:0}
.knob .v button{width:36px;height:36px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-weight:600;flex:none}
.knob.changed{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--bg);padding:8px 12px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.tog{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:.92rem}
.tog input{width:22px;height:22px}
.applybar{position:sticky;bottom:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.calc{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
.calc div{background:var(--bg);border-radius:8px;padding:8px}
.calc b{display:block;font:600 1.5rem var(--num)}
.calc span{font-size:.78rem;color:var(--mute)}
.calc .hi b{color:var(--bad)}
.mlist{display:flex;flex-direction:column;gap:6px}
.mitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.mitem .t{flex:1;min-width:0}
.mitem .t small{display:block;color:var(--mute)}
.mitem.shown{border-left:4px solid var(--good)}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:6px;background:#000}
.log{font-size:.88rem;max-height:52vh;overflow:auto}
.log div{display:grid;grid-template-columns:4.5ch 1fr;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.log b{font-family:var(--num);color:var(--mute);font-weight:500}
.lib{display:flex;flex-direction:column;gap:8px}
.libitem{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.libitem.cur{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.libitem h4{margin:0 0 2px;font:600 1.15rem var(--num)}
.out{white-space:pre-wrap;font-size:.92rem;background:var(--bg);border-radius:8px;padding:12px;margin-top:10px;max-height:60vh;overflow:auto}
.src h3{font:600 1.1rem var(--num);margin:16px 0 4px}
.src ul{margin:0;padding-left:18px}.src li{margin:4px 0;font-size:.9rem}
.src .open{color:var(--good);font-weight:600}.src .cred{color:var(--warn);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:50;max-width:90vw}

/* ---------- monitor ---------- */
.mon{position:fixed;inset:0;background:#000;color:#ddd;font-family:var(--num);display:flex;flex-direction:column;
 padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);user-select:none;-webkit-user-select:none}
.mhead{display:flex;align-items:center;gap:10px;padding:4px 10px;height:40px;border-bottom:1px solid #1c2a30;flex:none}
.mhead .bed{color:#9ab;font-size:1.05rem;white-space:nowrap}
.alarms{flex:1;display:flex;gap:6px;overflow:hidden;min-width:0}
.al{padding:2px 10px;border-radius:3px;font-weight:600;font-size:1.05rem;white-space:nowrap}
.al.high{background:#d0021b;color:#fff;animation:blink 1s steps(2) infinite}
.al.med{background:#f5c400;color:#000}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.al.high{animation:none}}
.mclock{color:#9ab;font-size:1.05rem}
.mbtn{background:#0e1a1f;border:1px solid #2a3d45;color:#bfe;border-radius:6px;padding:4px 10px;font-family:var(--num);font-size:1rem;min-height:32px}
.mbtn.on{background:#3a2a00;border-color:#f5c400;color:#f5c400}
.mbody{flex:1;display:flex;flex-direction:column;min-height:0}
.ch{flex:1;display:grid;grid-template-columns:minmax(0,1fr) clamp(118px,25%,260px);min-height:0;border-bottom:1px solid #0d171b}
.ch .wv{position:relative;min-width:0}
.wv canvas{position:absolute;inset:0;width:100%;height:100%}
.wv .lab{position:absolute;left:6px;top:2px;font-size:.95rem;z-index:2;opacity:.9}
.nb{display:flex;flex-direction:column;justify-content:center;padding:2px 10px;border-left:1px solid #0d171b;line-height:1;overflow:hidden}
.nb .k{font-size:.95rem;display:flex;justify-content:space-between;opacity:.9}
.nb .big{font-size:clamp(2.2rem,6.2vw,5rem);font-weight:600;text-align:right}
.nb .mid{font-size:clamp(1.6rem,4vw,3.2rem);font-weight:600;text-align:right}
.nb .sub{font-size:clamp(1rem,2vw,1.5rem);text-align:right;opacity:.9}
.nb.alarm{background:#3a0006}
.ecg{color:#3dff6e}.spo{color:#3fe0ff}.art{color:#ff4a4a}.co2{color:#ffe14a}.vent{color:#ff9d2e}.vflow{color:#e8f0ff}.nibp{color:#e8f0ff}
.vstrip{flex:1.6;display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr) clamp(118px,25%,260px);min-height:0;border-top:2px solid #1c2a30}
.vwaves{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);min-width:0;min-height:0;height:100%}
.vwaves .wv{position:relative;min-height:0;border-bottom:1px solid #0d171b}
.vgrid{display:grid;overflow:hidden;min-height:0;grid-template-columns:1fr 1fr;gap:2px 8px;padding:4px 10px;border-left:1px solid #0d171b;align-content:center}
.vgrid div{line-height:1}.vgrid span{font-size:.8rem;opacity:.75;display:block}.vgrid b{font-size:clamp(1.1rem,2.2vw,1.8rem);font-weight:600}
.vmode{grid-column:1/-1;color:#ff9d2e;font-size:1rem}
.mfoot{display:flex;align-items:stretch;gap:10px;padding:4px 10px;height:64px;border-top:1px solid #1c2a30;flex:none}
.nibpbox{display:flex;align-items:baseline;gap:10px;background:#0b1316;border:1px solid #23343b;border-radius:6px;padding:4px 12px;color:#e8f0ff}
.nibpbox b{font-size:2rem}.nibpbox span{opacity:.75}
.tempbox{display:flex;align-items:baseline;gap:6px;color:#ddd;padding:4px 8px}.tempbox b{font-size:1.8rem}
.mfoot .sp{flex:1}
.badge{background:#ff4a4a;color:#fff;border-radius:999px;padding:0 7px;margin-left:6px;font-size:.9rem}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.sheet{background:#0d1418;border:1px solid #2a3d45;border-radius:10px;max-width:min(1000px,96vw);max-height:92vh;overflow:auto;padding:16px 18px;color:#e6eef2;font-family:var(--ui)}
.sheet h2{font:600 1.6rem var(--num);margin:0 0 10px;color:#bfe}
.sheet img{max-width:100%;max-height:70vh;display:block;margin:0 auto;border-radius:4px}
.sheet table{border-collapse:collapse;width:100%;font-size:1.05rem}
.sheet td{padding:6px 10px;border-bottom:1px solid #22343c}
.sheet td.f{font-weight:700}.sheet td.H{color:#ff7b7b}.sheet td.L{color:#7bc4ff}
.sheet pre{white-space:pre-wrap;font:1rem/1.5 var(--ui);margin:0}
.sheet .x{float:right}
.start{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:30;color:#9fd}
.start button{font:600 1.6rem var(--num);background:#073;color:#dfe;border:0;border-radius:10px;padding:16px 34px}
.nurse{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#0d2a36;border:1px solid #3fe0ff;color:#e9fbff;padding:10px 16px;border-radius:8px;font:500 1.2rem var(--ui);max-width:88vw;z-index:15}
.nurse b{color:#3fe0ff;font-family:var(--num);margin-right:6px}
.inflate{font-size:1rem;color:#9ab}
</style></head><body>
<div id="app"></div>
<script>

// ---------- self-hosted runtime: replaces claude.ai capabilities with the HALO server ----------
(function(){
 const listeners={docs:{},cols:{}}; let ws=null, myId=null, wantRoom=null, retry=0;
 const roomHandlers={}; let peerHandlers=[]; let lastPeers=[]; let connHandlers=[];
 const snapDoc=(exists,data)=>({exists,data:()=>data===null||data===undefined?undefined:data,metadata:{fromCache:false,hasPendingWrites:false}});
 async function api(method,path,body){const r=await fetch(path,{method,headers:body!==undefined?{'Content-Type':'application/json'}:{},body:body!==undefined?JSON.stringify(body):undefined,credentials:'same-origin'});
  if(!r.ok){const e=new Error('HTTP '+r.status);e.code=r.status===403?'invalid_argument':r.status===413?'quota_exceeded':'unavailable';throw e}return r.json()}
 const enc=p=>p.split('/').map(encodeURIComponent).join('/');
 async function fetchDoc(path){const j=await api('GET','/api/doc/'+enc(path));return snapDoc(j.exists,j.data)}
 async function fetchCol(path){const j=await api('GET','/api/col/'+enc(path));const docs=j.docs.map(d=>({id:d.id,exists:true,data:()=>d.data,metadata:{}}));return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}}}
 function deliverDoc(path){(listeners.docs[path]||[]).forEach(l=>fetchDoc(path).then(l.next,()=>{}));
  const parent=path.slice(0,path.lastIndexOf('/'));(listeners.cols[parent]||[]).forEach(l=>fetchCol(parent).then(l.next,()=>{}))}
 function docRef(path){return {id:path.split('/').pop(),path,
  get:()=>fetchDoc(path),
  set:async d=>{await api('PUT','/api/doc/'+enc(path),d)},
  update:async d=>{const cur=await fetchDoc(path);if(!cur.exists){const e=new Error('missing');e.code='invalid_argument';throw e}await api('PUT','/api/doc/'+enc(path),{...cur.data(),...d})},
  delete:async()=>{await api('DELETE','/api/doc/'+enc(path))},
  onSnapshot(next,error){const l={next,error};(listeners.docs[path]=listeners.docs[path]||[]).push(l);fetchDoc(path).then(next,()=>{});return()=>{listeners.docs[path]=(listeners.docs[path]||[]).filter(x=>x!==l)}},
  collection:sub=>colRef(path+'/'+sub)}}
 function colRef(path){return {path,doc:id=>docRef(path+'/'+(id||Math.random().toString(36).slice(2,12))),get:()=>fetchCol(path),
  add:async d=>{const r=docRef(path+'/'+Math.random().toString(36).slice(2,12));await r.set(d);return r},
  onSnapshot(next,error){const l={next,error};(listeners.cols[path]=listeners.cols[path]||[]).push(l);fetchCol(path).then(next,()=>{});return()=>{listeners.cols[path]=(listeners.cols[path]||[]).filter(x=>x!==l)}},
  where(){return this},orderBy(){return this},limit(){return this}}}
 const db={doc:docRef,collection:colRef};

 function connect(){const code=wantRoom;if(!code)return;const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}/ws/${encodeURIComponent(code)}?role=${encodeURIComponent(window.__simRole||'monitor')}`);
  ws.onopen=()=>{retry=0;connHandlers.forEach(h=>{try{h(true)}catch(e){}});
   // resync everything a reconnect may have missed
   Object.keys(listeners.docs).forEach(p=>(listeners.docs[p]||[]).forEach(l=>fetchDoc(p).then(l.next,()=>{})));
   Object.keys(listeners.cols).forEach(p=>(listeners.cols[p]||[]).forEach(l=>fetchCol(p).then(l.next,()=>{})))};
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
   if(m.t==='hello')myId=m.id;
   else if(m.t==='peers'){lastPeers=m.peers.map(p=>({peer:p.id,by:null,isMe:p.id===myId,sameTab:p.id===myId,kind:'viewer',guest:false,presence:{role:p.role},updatedAt:Date.now()}));peerHandlers.forEach(h=>{try{h({peers:lastPeers,joined:[],left:[],updated:[]})}catch(e){}})}
   else if(m.t==='emit'){(roomHandlers[m.topic]||[]).forEach(h=>{try{h({topic:m.topic,data:m.data,peer:m.from,isMe:m.from===myId,sameTab:m.from===myId})}catch(e){}})}
   else if(m.t==='doc'){deliverDoc(m.path)}
   else if(m.t==='chart'){try{window.__onChart&&window.__onChart()}catch(e){}}};
  ws.onclose=()=>{connHandlers.forEach(h=>{try{h(false)}catch(e){}});setTimeout(connect,Math.min(8000,500*Math.pow(2,retry++)))}}
 const roomObj={emit:async(topic,data)=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({t:'emit',topic,data}))},
  on:(topic,h)=>{(roomHandlers[topic]=roomHandlers[topic]||[]).push(h);return()=>{roomHandlers[topic]=roomHandlers[topic].filter(x=>x!==h)}},
  presence:async()=>{},onPeers:h=>{peerHandlers.push(h);if(lastPeers.length)h({peers:lastPeers,joined:[],left:[],updated:[]});return()=>{peerHandlers=peerHandlers.filter(x=>x!==h)}},
  peers:()=>lastPeers,connected:()=>!!ws&&ws.readyState===1,onConnection:h=>{connHandlers.push(h);return()=>{connHandlers=connHandlers.filter(x=>x!==h)}},leave:async()=>{}};
 const room={...roomObj,join:async name=>{wantRoom=String(name).replace(/^sim-/,'');if(!ws)connect();return roomObj}};
 const assets={upload:async(blob,opt)=>{const r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':(opt&&opt.type)||blob.type},body:blob,credentials:'same-origin'});if(!r.ok){const e=new Error('upload');e.code='unavailable';throw e}const j=await r.json();return {id:j.id,url:j.url,sizeBytes:blob.size,contentType:blob.type}},
  delete:async id=>{await fetch('/api/upload/'+encodeURIComponent(id),{method:'DELETE',credentials:'same-origin'})}};
 window.__isInstructor=false;

// ---------- vent / respiratory mechanics model ----------
// single-compartment: C mL/cmH2O, R cmH2O/L/s
function ventCalc(v,l){
 const C=Math.max(3,l.c)/1000, R=Math.max(2,l.r), tau=R*C, rr=Math.max(4,v.rr), T=60/rr;
 const ti=clamp(v.ti||.9,.3,T*.8), te=T-ti, k=Math.exp(-te/tau);
 let vt, autoPeep=0, pinsp=v.pinsp||15, vr=0, Q=0, dP=0;
 if(v.mode==='VC'){vt=v.vt/1000; vr=vt*k/(1-k); autoPeep=vr/C; Q=vt/ti}
 else{ if(v.mode==='PRVC'){const a=1-Math.exp(-ti/tau);pinsp=clamp((v.vt/1000)/(C*a),5,45)}
   autoPeep=0; for(let i=0;i<30;i++){dP=Math.max(0,pinsp-autoPeep);vt=C*dP*(1-Math.exp(-ti/tau));vr=vt*k/(1-k);autoPeep=vr/C}
   dP=Math.max(0,pinsp-autoPeep)}
 const peep=v.peep, totPeep=peep+autoPeep;
 const pplat=totPeep+vt/C;
 const ppeak=v.mode==='VC'? pplat+Q*R : peep+pinsp;
 return {C,R,tau,T,ti,te,vt,vr,autoPeep,peep,totPeep,pplat,ppeak,Q,pinsp,dP,mode:v.mode,
  ve:vt*rr, dp:pplat-totPeep,
  at(t){ // t seconds since breath start → {p,f(L/min)}
   if(t<ti){ if(this.mode==='VC'){const V=Q*t;return {p:peep+autoPeep+Q*R+V/C-(t<.06?(1-t/.06)*Q*R:0),f:Q*60}}
     const f=(dP/R)*Math.exp(-t/tau);const rise=t<.08?t/.08:1;return {p:peep+(pinsp)*rise,f:f*60*rise}}
   const u=t-ti, vol=vt+vr, f=-(vol/tau)*Math.exp(-u/tau); return {p:peep+(u<.05?(1-u/.05)*(this.mode==='VC'?pplat-peep:pinsp):0),f:f*60}}};
}

const Sync={db:null,room:null,lobby:null,code:'',me:uid(),

  if(room){try{this.room=await room.join('sim-'+code)}catch(e){this.room=room}
   try{this.room.presence({role,me:this.me})}catch(e){}}
  return {db:!!db,room:!!this.room}},
 stateRef(){return this.db.doc('sims/'+this.code)},
 mediaCol(){return this.db.collection('sims/'+this.code+'/media')},
 ioRef(n){return this.db.doc('sims/'+this.code+'/io/'+n)},
 writers:{},
 write(key,ref,data){const w=this.writers[key]||(this.writers[key]={busy:false,pending:null});w.pending={ref,data};if(w.busy)return;w.busy=true;
  (async()=>{while(w.pending){const p=w.pending;w.pending=null;try{await p.ref.set(p.data)}catch(e){console.warn('db write',e);if(e&&e.code==='quota_exceeded')toast('Storage is full — delete old media.')}}w.busy=false})()},

  if(this.db)this.write('state',this.stateRef(),state)},

  if(this.db){try{this.stateRef().onSnapshot(s=>{if(s.exists)cb(s.data())},e=>console.warn(e))}catch(e){}}},

  if(this.room){try{this.room.on('order',m=>f(m.data))}catch(e){}}
  if(this.db){let first=true;try{this.ioRef('orders').onSnapshot(s=>{const l=(s.exists&&s.data().list)||[];if(first){l.forEach(o=>seen.add(o.id));first=false;return}l.forEach(f)})}catch(e){}}}
};

  if(st.ventOn===undefined&&st.vent)S.ventOn=true;
  S.trans=first?0:(st.t??30);S.stageId=st.id;
  if(st.nurse&&!first)S.nurse={id:uid(),text:st.nurse,ts:Date.now()};
  if(first)S.nurse=null;
  pub();if(!first)addLog(`→ Stage: ${st.name}${auto?' (auto)':''}`,'stage');

const SOURCES_HTML=`<h2>Data sources</h2>
<p class="muted small" style="max-width:70ch">Built into this simulator: ECG beat morphologies and rhythm strips from the <b>MIT-BIH Arrhythmia Database</b> (records 100, 107, 109, 119, 201, 205, 207) and <b>MIT-BIH Malignant Ventricular Ectopy Database</b> (record 418), PhysioNet, ODC-By; arterial, pleth and capnography templates from <b>VitalDB</b> case 1 (Lee et al., Sci Data 2022). Ventilator waveforms come from a single-compartment resistance–compliance model so they respond to your settings. <span class="open">Open</span> = download and use; <span class="cred">Credentialed</span> = training + data use agreement, use offline only — never upload into this app or send to an AI service.</p>
<h3>ECG and arrhythmia</h3><ul>
<li><span class="open">Open</span> MIMIC-IV-ECG — ~800k diagnostic 12-lead ECGs linked to ICU stays (PhysioNet)</li>

 <div class="field"><label for="code">Room code — use the same code on both iPads</label><input id="code" value="${esc(code)}" maxlength="10" autocomplete="off" autocapitalize="characters"></div>
 <div class="roles"><button class="role" id="asIns"><b>Instructor</b><span>Control vitals, vent, results, scenario path</span></button><button class="role rmon" id="asMon"><b>Bedside monitor</b><span>Learner-facing screen with sound</span></button><button class="role" id="asChart" style="grid-column:1/-1"><b>Student chart</b><span>History, results and ordering — for each learner's own device</span></button></div>
 <p class="note">Learners need no account — just this page and the room code. The instructor console uses your HALO Tracker sign-in. Sound needs the monitor iPad's ring/silent switch off. For teaching use only — not a medical device.</p></div></div>`;
 const go=async role=>{const c=($('#code').value||'ICU1').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,10)||'ICU1';LS.set('room',c);LS.set('role',role);
  let who={instructor:false};try{who=await (await fetch('/api/whoami',{credentials:'same-origin'})).json()}catch(e){}
  window.__isInstructor=!!who.instructor;
  if(role==='instructor'&&!who.instructor){location.href='/login?next=/sim';return}
  window.__simRole=role;
  document.getElementById('app').innerHTML='<div class="lobby"><p class="muted">Connecting…</p></div>';
  await Sync.init(c,role);role==='monitor'?Monitor(c):Instructor(c)};
 $('#asIns').onclick=()=>go('instructor');$('#asMon').onclick=()=>go('monitor');$('#asChart').onclick=()=>{const c=($('#code').value||'ICU1').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,10)||'ICU1';LS.set('room',c);location.href='/chart?room='+c};
}
Lobby();
(()=>{const qp=new URLSearchParams(location.search);const r=(qp.get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,10);
 if(r&&qp.get('role')==='monitor'){$('#code').value=r;$('#asMon').click()}})();
</script></body></html>
